# Used when developers run the `alembic` command directly, for example:
#   alembic revision --autogenerate -m "add alert status"
# The database URL comes from the VIGIL_DATABASE_URL environment variable, never this file.
# Everyday use goes through `vigil db upgrade`, which needs no config file at all.

[alembic]
script_location = %(here)s/src/vigil/storage/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
