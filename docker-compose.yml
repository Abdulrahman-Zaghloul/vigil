# Local PostgreSQL for development and tests:   docker compose up -d db
#
# The credentials are for local development only, and the port is published on
# 127.0.0.1 so the database is reachable from this machine but not from the network.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
