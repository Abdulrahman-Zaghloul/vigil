[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vigil"
dynamic = ["version"]
description = "A lightweight threat-detection engine for security logs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Abdulrahman Zaghloul" }]
dependencies = []

[project.scripts]
vigil = "vigil.cli:main"

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]
api = [
    "vigil[db]",  # the API reads and writes the database
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "httpx2>=2.0",  # used by FastAPI's TestClient
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.version]
path = "src/vigil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # pytest uses plain assert statements

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # tests use fake secrets on purpose

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["vigil"]
