[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vigil"
dynamic = ["version"]
description = "A lightweight threat-detection engine for security logs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Abdulrahman Zaghloul" }]
dependencies = []

[project.scripts]
vigil = "vigil.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.version]
path = "src/vigil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # pytest uses plain assert statements

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["vigil"]
